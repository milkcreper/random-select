<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ランダムタスク割り当て</title>
<style>
body { font-family: sans-serif; margin: 20px; }
input { width: 100%; margin-top: 4px; }
button { margin-top: 8px; padding: 6px 12px; }
.task-item { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.groupA { color: red; }
.groupB { color: blue; }
.result { white-space: pre-line; margin-top: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.task-delete { cursor: pointer; color: gray; }
.task-delete:hover { color: black; }
hr { margin: 20px 0; }
</style>
</head>
<body>

<h1>ランダムタスク割り当て</h1>

<div class="grid">
  <div>
    <h2 class="groupA">グループA（最大6人）</h2>
    <div id="groupAInputs"></div>
  </div>
  <div>
    <h2 class="groupB">グループB（最大6人）</h2>
    <div id="groupBInputs"></div>
  </div>
</div>

<hr>

<h2>タスク管理</h2>
<button onclick="toggleTasks()" id="toggleBtn">タスク一覧を非表示</button>

<div id="taskSection">
  <input id="newTask" placeholder="新しいタスクを入力">
  <button onclick="addTask()">タスク追加</button>
  <div id="taskList"></div>
</div>

<hr>

<label>
  <input type="checkbox" id="taskOn" checked>
  タスクを付与する
</label><br>

<button onclick="run()">実行</button>
<button onclick="reroll()">🔁 タスク再抽選</button>

<div class="result" id="result"></div>

<script>
// ===== 初期タスク =====
let tasks = [
  "ひよこクロスヘアにする",
  "右クリック禁止（ADSやオルト射撃禁止）",
  "効果音を口で発する",
  "語尾を「にゃん」にする",
  "歩き禁止(しゃがみ移動はあり)",
  "スナイパー専(ピストルはクラシック)",
  "ガーディアンとブルドック縛り(サブ武器は自由)",
  "ヘビーアーマー禁止",
  "SMG縛り",
  "ずっと過剰にポジティブ",
  "しゃがみキー外す",
  "ウルト溜まったらすぐ使う（システム上使えない場合は使えるときにすぐ使う）",
  "毎ラウンドショーティーを持っていく",
  "リロードキーを外す",
  "スキルを言う時に正式名称で言う",
  "UIを無くす",
  "キルする度にナルシストになる（自画自賛する）",
  "オウム返しでしゃべる",
  "ギャルになる",
  "語尾を「ござる」にする",
  "自分の考えてることしゃべり続ける",
  "あだ名でチームメンバーを呼ぶ",
  "死んでいる間味方をほめまくる",
  "定期的に嘘を言う",
  "味方チームが残り一人になったらその人に話しかける",
  "語尾を「でやんす」にする",
  "一人称を「おいどん」に、語尾を「ごわす」にする",
  "敬語縛り",
  "【当たり】味方の縛りから一つ好きなものを選んでその縛りを実行する"
];

// ===== 状態 =====
let groupA = [];
let groupB = [];
let taskOn = true;
let taskVisible = true;

// ===== 共通 =====
const shuffle = arr => arr.slice().sort(() => Math.random() - 0.5);

// ===== 名前入力 =====
function renderNameInputs() {
  const a = document.getElementById("groupAInputs");
  const b = document.getElementById("groupBInputs");
  a.innerHTML = b.innerHTML = "";
  for (let i = 0; i < 6; i++) {
    a.appendChild(createNameInput());
    b.appendChild(createNameInput());
  }
}
function createNameInput() {
  const input = document.createElement("input");
  input.placeholder = "名前";
  return input;
}

// ===== タスク表示切替 =====
function toggleTasks() {
  taskVisible = !taskVisible;
  document.getElementById("taskSection").style.display =
    taskVisible ? "block" : "none";
  document.getElementById("toggleBtn").textContent =
    taskVisible ? "タスク一覧を非表示" : "タスク一覧を表示";
}

// ===== タスクUI =====
function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "task-item";

    const span = document.createElement("span");
    span.textContent = t;

    const del = document.createElement("span");
    del.textContent = "×";
    del.className = "task-delete";
    del.onclick = () => {
      tasks.splice(i, 1);
      renderTasks();
    };

    div.appendChild(span);
    div.appendChild(del);
    list.appendChild(div);
  });
}

function addTask() {
  const input = document.getElementById("newTask");
  if (!input.value.trim()) return;
  tasks.push(input.value.trim());
  input.value = "";
  renderTasks();
}

// ===== 実行 =====
function run() {
  groupA = [...document.querySelectorAll("#groupAInputs input")]
    .map(i => i.value.trim()).filter(Boolean);
  groupB = [...document.querySelectorAll("#groupBInputs input")]
    .map(i => i.value.trim()).filter(Boolean);

  if (groupA.length + groupB.length === 0) {
    alert("名前を入力してください");
    return;
  }

  taskOn = document.getElementById("taskOn").checked;
  assign();
}

// ===== 再抽選 =====
function reroll() {
  if (groupA.length + groupB.length === 0) {
    alert("先に実行してください");
    return;
  }
  assign();
}

// ===== 割り当て =====
function assign() {
  const shuffledTasks = shuffle(tasks);
  if (taskOn && shuffledTasks.length < groupA.length + groupB.length) {
    alert("タスク数が足りません");
    return;
  }

  let i = 0;
  let html = `<div class="groupA">【グループA】\n`;
  groupA.forEach(n => {
    html += n + (taskOn ? " ： " + shuffledTasks[i++] : "") + "\n";
  });
  html += `</div>\n<div class="groupB">【グループB】\n`;
  groupB.forEach(n => {
    html += n + (taskOn ? " ： " + shuffledTasks[i++] : "") + "\n";
  });
  html += "</div>";

  document.getElementById("result").innerHTML = html;
}

// 初期化
renderNameInputs();
renderTasks();
</script>

</body>
</html>
